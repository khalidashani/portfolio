<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Running Progress - Khalid Ashani</title>
  <link rel="stylesheet" href="./style.css?v=3">
</head>
<body>

  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="running.html">Running Progress</a></li>
      <li><a href="coding_project.html">Coding Project</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <section style="text-align: center; margin-bottom: 15px;">
    <h1>Running Progress</h1>
    <p>Tracking my journey towards fitness and endurance goals.</p>
  </section>

  <section id="projects-container" style="text-align: center; margin-bottom: 15px;">
    <div class="project-card" style="max-width: 500px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px;">
      <h3>2026 Goal: 1000km</h3>
      
      <div style="background: #eee; border-radius: 10px; height: 20px; width: 100%; margin: 15px 0;">
        <div id="progress-bar" style="background: #4CAF50; height: 100%; width: 0%; border-radius: 10px; transition: width 1s ease-in-out;"></div>
      </div>
      
      <div class="tech-stack">
        <strong>Stats:</strong> 
        <span id="stat-completed">0.0km</span> Completed | 
        <span id="stat-remaining">1000.0km</span> Remaining
      </div>
    </div>
  </section>

  <footer>
    <p>© 2026 Khalid Ashani | All rights reserved. | Built with 💻 & ☕ using GitHub Pages</p>
  </footer>

  <script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQUSs4IaUnnmZ8vitG6r1fJw7uxRDq5q0jiODtoQXe8O5q0UohH4l2MQrjvdefOrIBD3yn2iYX0F4ON/pub?output=csv'; 

    async function updateRunningStats() {
      try {
        const response = await fetch(SHEET_URL);
        const data = await response.text();
        
        // Skips header row
        const rows = data.split('\n').slice(1); 
        let totalDistance = 0;

        rows.forEach(row => {
          const columns = row.split(',');
          // Using columns[1] as per your updated code
          const distance = parseFloat(columns[1]); 
          if (!isNaN(distance)) {
            totalDistance += distance;
          }
        });

        const goal = 1000;
        const percentage = Math.min((totalDistance / goal) * 100, 100);

        // These IDs must match the HTML exactly
        const progressBar = document.getElementById('progress-bar');
        const completedText = document.getElementById('stat-completed');
        const remainingText = document.getElementById('stat-remaining');

        if(progressBar) progressBar.style.width = percentage + '%';
        if(completedText) completedText.innerText = totalDistance.toFixed(1) + 'km';
        if(remainingText) remainingText.innerText = Math.max(0, (goal - totalDistance)).toFixed(1) + 'km';
        
      } catch (error) {
        console.error("Error fetching run data:", error);
      }
    }

    updateRunningStats();
  </script>

</body>
</html>
