    <h1>Running Progress</h1>
    <p>Tracking my journey towards fitness and endurance goals.</p>

  <section id="projects-container" style="text-align: center;">
    
    <div class="tech-stack">
      <strong>Stats:</strong> 
      <span id="stat-completed">0.00km</span> Completed | 
      <span id="stat-remaining">1000.00km</span> Remaining
    </div>
  </div>
</div>

<script>
  // PASTE YOUR PUBLISHED GOOGLE SHEET CSV URL HERE
  const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQUSs4IaUnnmZ8vitG6r1fJw7uxRDq5q0jiODtoQXe8O5q0UohH4l2MQrjvdefOrIBD3yn2iYX0F4ON/pub?output=csv'; 

async function updateRunningStats() {
    try {
      const response = await fetch(SHEET_URL);
      const data = await response.text();
      
      // This simple logic assumes your distance is in Column C (index 2)
      // and skips the header row.
      const rows = data.split('\n').slice(1); 
      let totalDistance = 0;

      rows.forEach(row => {
        const columns = row.split(',');
        const distance = parseFloat(columns[1]); // Adjust '1' if distance is in a different column
        if (!isNaN(distance)) {
          totalDistance += distance;
        }
      });

      const goal = 1000;
      const percentage = Math.min((totalDistance / goal) * 100, 100);

      // Update the UI
      document.getElementById('progress-bar').style.width = percentage + '%';
      document.getElementById('stat-completed').innerText = totalDistance.toFixed(1) + 'km';
      document.getElementById('stat-remaining').innerText = (goal - totalDistance).toFixed(1) + 'km';
      
    } catch (error) {
      console.error("Error fetching run data:", error);
    }
  }

  // Run the function when the page loads
  updateRunningStats();
</script>
